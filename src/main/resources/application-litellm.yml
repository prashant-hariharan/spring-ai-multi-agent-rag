spring:
  config:
    activate:
      on-profile: litellm
  ai:
    openai:
      api-key: ${LITELLM_MASTER_KEY:sk-litellm-dev}
      base-url: ${LITELLM_BASE_URL:http://localhost:4000}
      embedding:
        options:
          model: openai-embedding
      chat:
        options:
          model: openai
          temperature: 0.7
          max-tokens: 500
    providers:
      gemini:
        api-key: ${LITELLM_MASTER_KEY:sk-litellm-dev}
        model: gemini
        temperature: 0.7
        max-tokens: 750
        base-url: ${LITELLM_BASE_URL:http://localhost:4000}
        completion-path: /v1/chat/completions
      groq:
        api-key: ${LITELLM_MASTER_KEY:sk-litellm-dev}
        model: groq
        temperature: 0.7
        max-tokens: 500
        base-url: ${LITELLM_BASE_URL:http://localhost:4000}
        completion-path: /v1/chat/completions
      ollama:
        api-key: ${LITELLM_MASTER_KEY:sk-litellm-dev}
        model: ollama
        temperature: 0.7
        max-tokens: 500
        base-url: ${LITELLM_BASE_URL:http://localhost:4000}
        completion-path: /v1/chat/completions

app:
  ai:
    guardrails:
      enabled: false
    evaluation:
      enabled: true
      max-attempts: 2
  rag:
    retrieval:
      default-top-k: 6
      combined-top-k: 8
      similarity-threshold: 0.30
  cache:
    intent:
      ttl-minutes: 30
      max-size: 5000
    order-read:
      ttl-seconds: 60
      max-size: 10000
    order-llm:
      ttl-seconds: 45
      max-size: 5000
    rag-answer:
      ttl-seconds: 120
      max-size: 5000
    rag-context:
      ttl-seconds: 120
      max-size: 5000
